{% extends "base.html" %}
{% block title %}Reset password — SkillSwap{% endblock %}
{% block content %}
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="lede">Enter your email and we'll send reset instructions.</p>
      <form method="post" class="stack">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary btn-block btn-lg" type="submit">Send reset link</button>
      </form>
      <p class="auth-foot"><a href="{% url 'login' %}">Back to sign in</a></p>
    </div>
  </div>
{% endblock %}
