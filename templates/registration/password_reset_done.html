{% extends "base.html" %}
{% block title %}Check your email — SkillSwap{% endblock %}
{% block content %}
  <div class="auth-wrap">
    <div class="auth-card text-center">
      <div class="empty-icon" style="margin:0 auto var(--space-4)">✉️</div>
      <h1>Check your email</h1>
      <p class="lede">If an account exists for that address, we've sent password reset
      instructions. In development, the email prints to the server console.</p>
      <a class="btn btn-secondary btn-block" href="{% url 'login' %}">Back to sign in</a>
    </div>
  </div>
{% endblock %}
